<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JUST MAGIC — загрузка звука</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#080609;color:#f5eeee;font:16px system-ui;display:grid;place-items:center;padding:22px}main{width:min(560px,100%);border:1px solid #55202b;background:#120b10;padding:28px;border-radius:18px;box-shadow:0 0 60px #6b102533}h1{color:#ff334f;letter-spacing:.12em;font-size:22px}p{color:#c6b9bd;line-height:1.5}label{display:block;margin:20px 0 8px;color:#ffb8c2}input{display:block;width:100%;padding:12px;background:#09070a;border:1px solid #57303a;color:#fff;border-radius:8px}button{margin-top:24px;width:100%;padding:15px;background:#a20f2d;color:white;border:0;border-radius:8px;font-weight:800;letter-spacing:.08em;cursor:pointer}#status{margin-top:18px;white-space:pre-wrap;color:#ffb8c2}</style><main><h1>JUST MAGIC // AUDIO RESTORE</h1><p>Выбери именно свои исходные MP3. Они сохранятся на сервере игры и подключатся автоматически.</p><form id="f"><label>Фоновая атмосфера — ambient.mp3</label><input name="ambient.mp3" type="file" accept=".mp3,audio/mpeg" required><label>Финальный испуг — scream-laugh.mp3</label><input name="scream-laugh.mp3" type="file" accept=".mp3,audio/mpeg" required><button>ЗАГРУЗИТЬ МОИ ЗВУКИ</button></form><div id="status"></div></main><script>const key=new URLSearchParams(location.search).get("key");document.querySelector("#f").addEventListener("submit",async e=>{e.preventDefault();const f=e.currentTarget,d=new FormData();d.append("ambient.mp3",f.elements["ambient.mp3"].files[0]);d.append("scream-laugh.mp3",f.elements["scream-laugh.mp3"].files[0]);const s=document.querySelector("#status");s.textContent="Загружаю…";try{const r=await fetch("/upload?key="+encodeURIComponent(key||""),{method:"POST",body:d});s.textContent=await r.text();if(r.ok)s.textContent+="\nГотово. Открой игру заново."}catch(err){s.textContent="Ошибка: "+err.message}});</script></html>
